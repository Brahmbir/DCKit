# .github/workflows/deploy-docs.yml
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "_docs/**" # your docs folder
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: # manual re-run button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _docs # where package.json lives
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: _docs/package-lock.json
      - run: npm ci
      - run: npm run build # produces _docs/out with output: "export"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
